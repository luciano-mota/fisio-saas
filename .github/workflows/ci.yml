name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fisio_test
          POSTGRES_USER: fisio
          POSTGRES_PASSWORD: fisio_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisio -d fisio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes com PostgreSQL e Flyway
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes e build
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm test && npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Imagem Docker de produção
        run: docker build -t fisio-saas:ci .
