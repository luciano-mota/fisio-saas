# Produção (ex.: VM Oracle Cloud Always Free). Variáveis vêm do arquivo .env (fora do Git).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fisio
      DATABASE_USER: fisio
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fisio
      POSTGRES_USER: fisio
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisio -d fisio"]
      interval: 5s
      retries: 12
    # Sem "ports": o banco nunca fica exposto na internet.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:?defina DOMAIN no .env} --to app:8080
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
